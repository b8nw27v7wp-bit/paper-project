services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: planner-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: planner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: planner-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # L9: FastAPI server 容器（nginx /api 代理目标）
  server:
    build:
      context: ./apps/server
      # dockerfile 相对 build context 解析：apps/server + ../../docker = 仓库根 docker/
      dockerfile: ../../docker/Dockerfile.server
      args:
        # 容器内实测：tuna 403、huawei 429，aliyun/ustc/tencent/官方均 200；默认 aliyun
        # 官方源：PIP_INDEX_URL=https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: planner-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 开发热更：挂载本地代码，重建镜像即生效（可选，生产可去掉）
      - ./apps/server/app:/app/app
    environment:
      # USE_PG=1  codes database.py 切 PG+pgvector（缺省 0 会静默回退 SQLite）
      USE_PG: "1"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: learning-planner
      MINIO_SECURE: "false"
      # L12: jobstore 持久化（空=内存 JobStore；此处指向 pg）
      SCHEDULER_JOBSTORE_URL: postgresql://postgres:postgres@postgres:5432/app
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 宿主机梯子代理（本机 127.0.0.1:${PROXY_PORT:-33210}；容器内经 host.docker.internal 访问）
      # 注意：变量名刻意不用 HTTP_PROXY，避免被宿主机同名 env 插值覆盖成 127.0.0.1
      # openai SDK(httpx) 自动读代理 env；NO_PROXY 保证内网直连不走梯子
      HTTP_PROXY: http://host.docker.internal:${PROXY_PORT:-33210}
      HTTPS_PROXY: http://host.docker.internal:${PROXY_PORT:-33210}
      http_proxy: http://host.docker.internal:${PROXY_PORT:-33210}
      https_proxy: http://host.docker.internal:${PROXY_PORT:-33210}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,neo4j,minio,server,host.docker.internal
      no_proxy: localhost,127.0.0.1,postgres,redis,neo4j,minio,server,host.docker.internal
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # P2 前端（Vite 构建产物由 nginx 静态托管，代理 /api → server:8000）
  frontend:
    image: nginx:alpine
    container_name: planner-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 容器内 localhost 优先解析 ::1 会被拒，用 127.0.0.1
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:
