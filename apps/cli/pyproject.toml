[project]
name = "studying-planner-cli"
version = "0.1.0"
description = "Studying Planner CLI - Trace工具 (Typer+Rich) 对标 hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
studying = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
